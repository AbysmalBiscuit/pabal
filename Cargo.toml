[package]
name = "pabal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Typed hook payloads and responses for Claude Code and Codex"
repository = "https://github.com/AbysmalBiscuit/pabal"
keywords = ["hooks", "claude-code", "codex", "agents"]
categories = ["development-tools", "parser-implementations"]
readme = "README.md"

[features]
clap = ["dep:clap"]

[dependencies]
ambassador = "0.5"
clap = { version = "4", optional = true, default-features = false, features = ["std", "derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
jsonschema = "0.58"
