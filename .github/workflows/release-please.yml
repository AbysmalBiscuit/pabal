name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains the release PR and, on merge, creates the tag and GitHub Release,
  # then publishes that tag to crates.io.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT, not GITHUB_TOKEN: pushes and PRs made with GITHUB_TOKEN
          # start no workflows, so CI would never run on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - if: ${{ steps.release.outputs.release_created }}
        uses: dtolnay/rust-toolchain@stable

      - if: ${{ steps.release.outputs.release_created }}
        name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
