name: Drift

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      # Issues filed with GITHUB_TOKEN start no workflows, so the @claude tag
      # needs DRIFT_TOKEN (a PAT or app token) to reach Claude.
      GH_TOKEN: ${{ secrets.DRIFT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - run: gh label create drift --force --color d93f0b --description "Upstream harness drift"
      - run: bun run scripts/drift.ts
